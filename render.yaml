services:
  - type: web
    name: zhephertv
    runtime: image
    image:
      url: ghcr.io/13lsr/zhephertv:latest
    numInstances: 1
    plan: free
    healthCheckPath: /
    envVars:
      - key: USERNAME
        sync: false
      - key: PASSWORD
        sync: false
      - key: NEXT_PUBLIC_STORAGE_TYPE
        value: upstash
      - key: NEXT_PUBLIC_SITE_NAME
        value: ZephyrTV
      - key: NEXT_PUBLIC_USER_DATA_STORAGE
        value: remote
      - key: DISABLE_STATS
        value: 'false'
      - key: UPSTASH_URL
        sync: false
      - key: UPSTASH_TOKEN
        sync: false
      - key: DISABLE_HERO_TRAILER
        value: "true"
